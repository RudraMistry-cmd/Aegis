name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that required files are present
        run: |
          set -euo pipefail
          missing=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "missing required file: $f"
              missing=1
            fi
          done <<'FILES'
          README.md
          LICENSE
          package.json
          tsconfig.json
          .gitignore
          CHANGELOG.md
          CONTRIBUTING.md
          src/index.ts
          src/domain/index.ts
          src/errors/index.ts
          src/ports/index.ts
          src/rbac/index.ts
          src/policy/index.ts
          src/auth/index.ts
          src/storage/memory/index.ts
          test/unit/login.test.ts
          test/unit/refresh.test.ts
          test/unit/revoke.test.ts
          test/unit/rbac.test.ts
          test/unit/policy.test.ts
          test/conformance/authz.conformance.test.ts
          test/conformance/authn.conformance.test.ts
          test/conformance/race.conformance.test.ts
          examples/in-memory-demo.ts
          scripts/run-tests.sh
          docs/DESIGN.md
          docs/CONFORMANCE.md
          spec/errors.md
          spec/invariants.md
          spec/conformance.md
          spec/auth/principal.md
          spec/auth/session.md
          spec/auth/tokens.md
          spec/rbac/roles.md
          spec/rbac/permissions.md
          spec/rbac/assignments.md
          spec/policy/policy.md
          spec/policy/scope.md
          spec/storage/interfaces.md
          spec/flows/login.md
          spec/flows/refresh.md
          spec/flows/revoke.md
          migrations/001_init.sql
          migrations/002_indexes.sql
          migrations/003_create_keys_table.sql
          src/storage/postgres/postgresClient.ts
          src/storage/postgres/unitOfWork.ts
          src/storage/postgres/sessionStore.ts
          src/storage/postgres/refreshTokenStore.ts
          src/storage/postgres/roleStore.ts
          src/storage/postgres/assignmentStore.ts
          docs/POSTGRES.md
          docs/JWKS.md
          src/adapters/express/middleware.ts
          src/adapters/express/errors.ts
          src/adapters/express/routes.ts
          src/adapters/express/app.ts
          test/express/adapter.test.ts
          src/storage/postgres/keyStore.ts
          src/storage/file/keyStore.ts
          src/storage/memory/keyStore.ts
          src/auth/jwt/keySealing.ts
          src/auth/jwt/persistentKeyProvider.ts
          src/auth/jwt/jwks.ts
          FILES
          exit "$missing"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Run the demo
        run: npm run start-demo

  postgres:
    # Runs the PostgreSQL adapter suite (contract, concurrency, transactions, flows) against a real
    # PostgreSQL 17 server. AEGIS_PG_URL makes scripts/test-postgres.mjs use it instead of starting
    # an embedded server.
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_PG_URL: postgres://aegis:aegis@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL adapter suite
        run: npm run test:pg
