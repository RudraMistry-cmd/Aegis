<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis Notes</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
      --accent: #3557d4; --accent-text: #fff; --danger: #c0392b; --ok: #1e8e5a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #98a1b2; --line: #2b3240;
        --accent: #6f8cff; --accent-text: #0d1020; --danger: #ff7a6b; --ok: #5fd39a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
    input, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px;
                      background: var(--bg); color: var(--text); font: inherit; margin-bottom: 12px; }
    textarea { resize: vertical; min-height: 64px; }
    button { font: inherit; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line);
             background: var(--card); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button.link { border: 0; background: none; color: var(--danger); padding: 2px 6px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .quick button { font-size: 13px; padding: 4px 10px; }
    .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; gap: 8px; justify-content: space-between; }
    li:first-child { border-top: 0; }
    .meta { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); }
    #status { min-height: 1.5em; font-size: 13px; margin: 0 0 16px; }
    #status.err { color: var(--danger); } #status.ok { color: var(--ok); }
    code { font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Aegis Notes</h1>
  <p class="sub">A tiny app whose login, sessions and permissions are handled by Aegis.</p>
  <p id="status" role="status"></p>

  <section id="login" class="card">
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" value="alice@example.com" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" value="demo-password-123" autocomplete="current-password" required>
      <div class="row">
        <button class="primary" type="submit">Sign in</button>
        <span class="quick row">
          <button type="button" data-user="alice@example.com">Alice</button>
          <button type="button" data-user="carol@example.com">Carol</button>
          <button type="button" data-user="bob@example.com">Bob (read-only)</button>
        </span>
      </div>
    </form>
  </section>

  <section id="app" hidden>
    <div class="card who">
      <div><strong id="me-email"></strong><div class="meta" id="me-detail"></div></div>
      <div class="row">
        <button id="refresh-btn" type="button" title="Exchange the refresh token for new tokens">Refresh token</button>
        <button id="logout-btn" type="button">Sign out</button>
      </div>
    </div>
    <div class="card">
      <form id="note-form">
        <label for="text">New note</label>
        <textarea id="text" maxlength="500" placeholder="Write something…"></textarea>
        <button class="primary" type="submit">Add note</button>
      </form>
    </div>
    <div class="card"><ul id="notes"></ul></div>
  </section>
</main>

<script>
  // Tokens live only in memory: a page reload signs you out. That keeps them away from other
  // scripts' storage; a production app would typically keep the refresh token in an HttpOnly cookie.
  let accessToken = null;
  let refreshToken = null;
  let myId = null;

  const $ = (id) => document.getElementById(id);
  const status = (text, kind = '') => { $('status').textContent = text; $('status').className = kind; };

  async function call(method, path, body, retried = false) {
    const res = await fetch(path, {
      method,
      headers: {
        ...(body ? { 'content-type': 'application/json' } : {}),
        ...(accessToken ? { authorization: `Bearer ${accessToken}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const data = await res.json();
    if (res.ok) return data;
    // An expired access token: refresh once, then retry the original request.
    if (data.error?.code === 'TOKEN_EXPIRED' && refreshToken && !retried) {
      await refresh();
      return call(method, path, body, true);
    }
    const err = new Error(data.error?.message ?? 'Request failed');
    err.code = data.error?.code; err.status = res.status;
    throw err;
  }

  const show = (e) => status(`${e.status ?? ''} ${e.code ?? ''}: ${e.message}`.trim(), 'err');

  async function refresh() {
    const t = await call('POST', '/auth/refresh', { refreshToken });
    accessToken = t.accessToken; refreshToken = t.refreshToken;
  }

  async function loadNotes() {
    const list = await call('GET', '/api/notes');
    const ul = $('notes');
    ul.replaceChildren();
    if (list.length === 0) {
      const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No notes yet.';
      ul.append(li); return;
    }
    for (const n of list) {
      const li = document.createElement('li');
      const left = document.createElement('div');
      const text = document.createElement('div'); text.textContent = n.text;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = `${n.owner}${n.ownerId === myId ? ' (you)' : ''} · ${new Date(n.createdAt).toLocaleTimeString()}`;
      left.append(text, meta);
      const del = document.createElement('button');
      del.className = 'link'; del.type = 'button'; del.textContent = 'Delete';
      del.onclick = async () => {
        try { await call('DELETE', `/api/notes/${n.id}`); status('Deleted.', 'ok'); await loadNotes(); }
        catch (e) { show(e); }
      };
      li.append(left, del);
      ul.append(li);
    }
  }

  async function enter(email) {
    const me = await call('GET', '/auth/me');
    myId = me.id;
    $('me-email').textContent = email;
    $('me-detail').textContent = `user ${me.id.slice(0, 8)}… · signed in ${new Date(me.authenticatedAt).toLocaleTimeString()}`;
    $('login').hidden = true; $('app').hidden = false;
    await loadNotes();
  }

  $('login-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const email = $('email').value;
    try {
      const t = await call('POST', '/auth/login', { identifier: email, password: $('password').value });
      accessToken = t.accessToken; refreshToken = t.refreshToken;
      status('Signed in.', 'ok');
      await enter(email);
    } catch (e) { show(e); }
  };

  document.querySelectorAll('[data-user]').forEach((b) => {
    b.onclick = () => { $('email').value = b.dataset.user; $('login-form').requestSubmit(); };
  });

  $('note-form').onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      await call('POST', '/api/notes', { text: $('text').value });
      $('text').value = ''; status('Note added.', 'ok');
      await loadNotes();
    } catch (e) { show(e); }
  };

  $('refresh-btn').onclick = async () => {
    try { await refresh(); status('Tokens refreshed (the old refresh token is now spent).', 'ok'); }
    catch (e) { show(e); }
  };

  $('logout-btn').onclick = async () => {
    try { await call('POST', '/auth/logout', { refreshToken }); } catch { /* signing out anyway */ }
    accessToken = refreshToken = myId = null;
    $('app').hidden = true; $('login').hidden = false;
    status('Signed out. That session is revoked on the server.', 'ok');
  };
</script>
</body>
</html>
